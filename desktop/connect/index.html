<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>crew</title>
    <style>
      :root { color-scheme: light dark; --bg: #ffffff; --fg: #1d1d1f; --muted: #6e6e73; --accent: #0a84ff; --line: #d2d2d7; }
      @media (prefers-color-scheme: dark) { :root { --bg: #000000; --fg: #f5f5f7; --muted: #a1a1a6; --line: #3a3a3c; } }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 17px -apple-system, system-ui, sans-serif; }
      main { max-width: 420px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 64px) 20px 20px; }
      h1 { font-size: 28px; margin: 0 0 8px; }
      p { color: var(--muted); margin: 0 0 24px; line-height: 1.4; }
      input { box-sizing: border-box; width: 100%; padding: 12px; font: inherit; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 10px; }
      button { margin-top: 16px; width: 100%; padding: 12px; font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 10px; }
      #error { color: #ff453a; min-height: 1.4em; margin: 12px 0 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>Connect to crew</h1>
      <p>Type the address of your <code>crew serve</code>. Then pair with the code from <code>crew remote pair</code>.</p>
      <form id="form">
        <input id="server" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="crew.example.ts.net" required />
        <button type="submit">Connect</button>
        <p id="error" role="alert"></p>
      </form>
    </main>
    <script type="module">
      import { serverUrl } from "./server.js";
      const key = "crew.server";
      const saved = (() => { try { return localStorage.getItem(key); } catch { return null; } })();
      const change = new URLSearchParams(location.search).has("change");
      if (saved && !change) {
        location.replace(saved);
      }
      const input = document.getElementById("server");
      if (saved) {
        input.value = saved;
      }
      document.getElementById("form").addEventListener("submit", (event) => {
        event.preventDefault();
        const url = serverUrl(input.value);
        if (!url) {
          document.getElementById("error").textContent = "That is not a valid address.";
          return;
        }
        try { localStorage.setItem(key, url); } catch {}
        location.assign(url);
      });
    </script>
  </body>
</html>
