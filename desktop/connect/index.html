<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>crew</title>
    <style>
      :root { color-scheme: light dark; --bg: #ffffff; --fg: #1d1d1f; --muted: #6e6e73; --accent: #0a84ff; --line: #d2d2d7; --danger: #d70015; }
      @media (prefers-color-scheme: dark) { :root { --bg: #000000; --fg: #f5f5f7; --muted: #a1a1a6; --line: #3a3a3c; --danger: #ff453a; } }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 17px -apple-system, system-ui, sans-serif; }
      main { max-width: 420px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 64px) 20px 20px; }
      h1 { font-size: 28px; margin: 0 0 8px; }
      h2 { font-size: 15px; font-weight: 600; color: var(--muted); text-transform: uppercase; margin: 0 0 8px; }
      p { color: var(--muted); margin: 0 0 24px; line-height: 1.4; }
      input { box-sizing: border-box; width: 100%; padding: 12px; font: inherit; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 10px; }
      button { min-height: 44px; font: inherit; border-radius: 10px; }
      .primary { margin-top: 16px; width: 100%; padding: 12px; font-weight: 600; color: #fff; background: var(--accent); border: 0; }
      #servers { list-style: none; margin: 0 0 32px; padding: 0; border: 1px solid var(--line); border-radius: 10px; }
      #servers li { display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 12px; }
      #servers li + li { border-top: 1px solid var(--line); }
      #servers .open { flex: 1; text-align: left; padding: 8px 0; color: var(--accent); background: none; border: 0; overflow-wrap: anywhere; }
      #servers .remove { padding: 8px 12px; color: var(--danger); background: none; border: 0; }
      #error { color: var(--danger); min-height: 1.4em; margin: 12px 0 0; }
      .problem-page { --ink: #1c1c1f; --ink-2: #5c5c66; --ink-3: #8e8e98; --line-2: rgba(20,20,30,.14); --sunken: #f4f4f5; --hover: #efeff1; --bad: oklch(0.58 0.19 25); color-scheme: light; background: #ffffff; color: var(--ink); font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
      .problem-page main { max-width: 560px; min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; padding: 24px; }
      .problem-page h1 { font-size: 22px; font-weight: 600; letter-spacing: -.02em; margin: 0 0 4px; }
      #problem .lead { color: var(--ink-2); margin: 0 0 16px; font-size: 13px; }
      #problem .lead strong { color: var(--bad); font-weight: 500; }
      #problem .detail { position: relative; }
      #problem pre { margin: 0; font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace; background: var(--sunken); color: var(--ink); border-radius: 8px; padding: 10px 12px; padding-right: 72px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 50vh; overflow: auto; user-select: text; -webkit-user-select: text; cursor: text; }
      #problem .btn { min-height: 0; height: 30px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line-2); background: #ffffff; color: var(--ink); font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; -webkit-appearance: none; appearance: none; }
      #problem .btn:hover { background: var(--hover); }
      #problem .btn.primary { width: auto; margin: 0; padding: 0 14px; background: var(--ink); border-color: var(--ink); color: #ffffff; }
      #problem .btn:disabled { opacity: .5; cursor: default; }
      #problem #copy { position: absolute; top: 6px; right: 6px; height: 24px; padding: 0 8px; font-size: 12px; }
      #problem .actions { display: flex; justify-content: flex-end; gap: 6px; margin-top: 16px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Connect to crew</h1>
      <section id="saved" hidden aria-labelledby="saved-title">
        <h2 id="saved-title">Servers</h2>
        <ul id="servers"></ul>
      </section>
      <h2 id="add-title">Add a server</h2>
      <p>Type the address of your <code>crew serve</code>. Then pair with the code from <code>crew remote pair</code>.</p>
      <form id="form" aria-labelledby="add-title">
        <input id="server" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="crew.example.ts.net" aria-label="Address" required />
        <button class="primary" type="submit">Connect</button>
        <p id="error" role="alert"></p>
      </form>
      <section id="problem" hidden>
        <p class="lead"><strong id="problem-title">crew is not running</strong> · Fix sets up the crew daemon and starts crew again.</p>
        <div class="detail">
          <pre id="problem-reason"></pre>
          <button id="copy" class="btn" type="button">Copy</button>
        </div>
        <div class="actions"><button id="fix" class="btn primary" type="button">Fix</button></div>
      </section>
    </main>
    <script type="module">
      import { failureText, forgetServer, rememberServer, savedServers, serverUrl } from "./server.js";
      const problem = window.__CREW_DESKTOP_PROBLEM__;
      if (typeof problem === "string") {
        document.body.classList.add("problem-page");
        document.querySelector("h1").textContent = "crew did not start";
        document.getElementById("form").hidden = true;
        document.getElementById("add-title").hidden = true;
        document.getElementById("add-title").nextElementSibling.hidden = true;
        document.getElementById("problem").hidden = false;
        document.getElementById("problem").setAttribute("role", "status");
        document.getElementById("problem-reason").textContent = problem;
        const copy = document.getElementById("copy");
        copy.addEventListener("click", async () => {
          const text = document.getElementById("problem-reason").textContent;
          try {
            await navigator.clipboard.writeText(text);
          } catch {
            const range = document.createRange();
            range.selectNodeContents(document.getElementById("problem-reason"));
            getSelection().removeAllRanges();
            getSelection().addRange(range);
            document.execCommand("copy");
          }
          copy.textContent = "Copied";
          setTimeout(() => { copy.textContent = "Copy"; }, 1500);
        });
        const fix = document.getElementById("fix");
        fix.addEventListener("click", async () => {
          fix.disabled = true;
          fix.textContent = "Fixing…";
          document.getElementById("problem-title").textContent = "Fixing the daemon";
          try {
            await window.__TAURI_INTERNALS__.invoke("fix_daemon");
          } catch (err) {
            document.getElementById("problem-title").textContent = "Fix failed";
            document.getElementById("problem-reason").textContent = failureText(err);
            fix.disabled = false;
            fix.textContent = "Fix";
          }
        });
      }
      const storage = {
        getItem: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
        setItem: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
      };
      let list = typeof problem === "string" ? [] : savedServers(storage);
      const save = () => storage.setItem("crew.servers", JSON.stringify(list));
      const open = (url) => {
        list = rememberServer(list, url);
        save();
        location.assign(url);
      };
      const change = new URLSearchParams(location.search).has("change");
      if (list.length > 0 && !change) {
        location.replace(list[0]);
      }
      const ul = document.getElementById("servers");
      const draw = () => {
        document.getElementById("saved").hidden = list.length === 0;
        ul.replaceChildren(...list.map((url) => {
          const li = document.createElement("li");
          const go = document.createElement("button");
          go.type = "button";
          go.className = "open";
          go.textContent = new URL(url).host;
          go.addEventListener("click", () => open(url));
          const remove = document.createElement("button");
          remove.type = "button";
          remove.className = "remove";
          remove.textContent = "Remove";
          remove.setAttribute("aria-label", "Remove " + new URL(url).host);
          remove.addEventListener("click", () => {
            list = forgetServer(list, url);
            save();
            draw();
          });
          li.append(go, remove);
          return li;
        }));
      };
      draw();
      const input = document.getElementById("server");
      document.getElementById("form").addEventListener("submit", (event) => {
        event.preventDefault();
        const url = serverUrl(input.value);
        if (!url) {
          document.getElementById("error").textContent = "That is not a valid address.";
          return;
        }
        open(url);
      });
    </script>
  </body>
</html>
