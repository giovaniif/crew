name: ios

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ios:
    runs-on: macos-15
    env:
      UPLOAD: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: npx tauri ios build --help
        working-directory: desktop
      - name: init
        working-directory: desktop
        run: |
          if [ ! -d src-tauri/gen/apple ]; then
            npx tauri ios init --ci
            npx tauri icon ../macos/AppIcon.png --ios-color '#ffffff'
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: gen-apple
          path: desktop/src-tauri/gen/apple
      - name: simulator build
        if: env.UPLOAD != 'true'
        working-directory: desktop
        run: npx tauri ios build --debug --target aarch64-sim --ci
      - name: signed build
        if: env.UPLOAD == 'true'
        working-directory: desktop
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          key_path=~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8
          printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
          export APPLE_API_KEY_PATH="$key_path"
          npx tauri ios build --export-method app-store-connect --build-number "$BUILD_NUMBER" --ci
      - name: check
        working-directory: desktop/src-tauri/gen/apple/build
        run: |
          find . -maxdepth 4 \( -name '*.ipa' -o -name '*.app' \) -print
          app=$(find . -name '*.app' -path '*arm64*' -o -name '*.app' | head -n 1)
          [ "$(plutil -extract ITSAppUsesNonExemptEncryption raw "$app/Info.plist")" = false ]
      - name: upload to TestFlight
        if: env.UPLOAD == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          ipa=$(find desktop/src-tauri/gen/apple/build -name '*.ipa' | head -n 1)
          xcrun altool --upload-app --type ios --file "$ipa" --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build
          path: |
            desktop/src-tauri/gen/apple/build/**/*.ipa
            desktop/src-tauri/gen/apple/build/**/*.app
