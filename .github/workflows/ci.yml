name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          install-only: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make web
      - run: npm test
        working-directory: web
      - run: CREW_WEB_BUILT=1 go test ./internal/serve/ -run Static
      - run: make build
      - run: ./bin/crew version
      - run: make lint
      - run: BUDGET_SCALE=2 scripts/bench-hook.sh ./bin/crew
      - run: brew list tmux >/dev/null 2>&1 || brew install tmux
      - run: brew list neovim >/dev/null 2>&1 || brew install neovim
      - run: go test ./...
      - run: go vet -tags integration -composites=false ./...
      - run: go test -p 2 -tags integration ./...

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: swift --version
      - run: swift test
        working-directory: macos
        env:
          CREW_SNAPSHOTS: ${{ runner.temp }}/snapshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-snapshots
          path: ${{ runner.temp }}/snapshots
          if-no-files-found: warn
      - run: macos/build-app
      - run: codesign --verify --verbose macos/build/crew.app
      - run: test -f macos/build/crew.app/Contents/Resources/AppIcon.icns
      - run: '[ "$(plutil -extract CFBundleIconFile raw macos/build/crew.app/Contents/Info.plist)" = AppIcon ]'

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: npm ci
        working-directory: web
      - run: make web
      - run: cargo install tauri-driver --locked
      - run: cargo build --locked --manifest-path desktop/src-tauri/Cargo.toml
      - run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml
      - run: node --test desktop/connect/server.test.mjs
      - run: xvfb-run -a desktop/e2e/run

  android:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.0.12077973
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - id: ndk-cache
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
          key: ndk-${{ runner.os }}-${{ env.NDK_VERSION }}
      - if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          for attempt in 1 2 3; do
            if "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" && [ -f "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties" ]; then
              exit 0
            fi
            echo "sdkmanager: NDK install attempt $attempt failed"
            rm -rf "$ANDROID_HOME/ndk/$NDK_VERSION"
            sleep $((attempt * 15))
          done
          exit 1
      - run: |
          test "$ANDROID_HOME" = /usr/local/lib/android/sdk
          test -f "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: android
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - run: make web
      - run: npm ci
        working-directory: desktop
      - run: npx tauri android build --debug --apk
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: crew-android-debug
          path: desktop/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          if-no-files-found: error
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - id: sysimg-cache
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/system-images/android-34/google_apis/x86_64
          key: sysimg-${{ runner.os }}-34-google_apis-x86_64
      - if: steps.sysimg-cache.outputs.cache-hit != 'true'
        run: |
          for attempt in 1 2 3; do
            if "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "system-images;android-34;google_apis;x86_64" && [ -f "$ANDROID_HOME/system-images/android-34/google_apis/x86_64/system.img" ]; then
              exit 0
            fi
            echo "sdkmanager: system image install attempt $attempt failed"
            rm -rf "$ANDROID_HOME/system-images/android-34/google_apis/x86_64"
            sleep $((attempt * 15))
          done
          exit 1
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          emulator-boot-timeout: 600
          script: desktop/android-smoke

  desktop-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: cargo build --locked --manifest-path desktop/src-tauri/Cargo.toml

  tdd:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y tmux neovim
      - run: cp scripts/tdd-check "$RUNNER_TEMP/" && "$RUNNER_TEMP/tdd-check" "origin/${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}"
        env:
          TDD_PR_TITLE: ${{ github.event.pull_request.title }}

  mutate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
      - run: make mutate
